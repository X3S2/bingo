# =============================================================================
# StreamBingo – docker-compose für Synology NAS (Container Manager)
# =============================================================================
# Diese Datei enthält ALLE Werte direkt eingetragen (keine .env-Datei nötig).
# Suche nach "ANPASSEN" und ersetze die Platzhalter durch deine echten Werte.
#
# Anleitung:
# 1. Inhalt dieser Datei vollständig in das YAML-Feld des Container Managers kopieren
# 2. Alle "ANPASSEN_*" Platzhalter durch echte Werte ersetzen
# 3. Auf "Erstellen" klicken
# =============================================================================

services:

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────
  streambingo-proxy:
    image: nginx:1.27-alpine
    container_name: streambingo-proxy
    restart: unless-stopped
    ports:
      - "4000:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      streambingo-web:
        condition: service_healthy
      streambingo-api:
        condition: service_healthy
    networks:
      - streambingo-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Next.js Frontend ────────────────────────────────────────────────────
  streambingo-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: streambingo-web
    restart: unless-stopped
    ports:
      - "4001:3000"
    environment:
      - NODE_ENV=production
      # ANPASSEN: Deine öffentliche Domain (z.B. https://bingo.meinname.ipv64.net)
      - NEXT_PUBLIC_API_URL=https://ANPASSEN_DEINE_DOMAIN/api
      - NEXT_PUBLIC_WS_URL=https://ANPASSEN_DEINE_DOMAIN
      - NEXTAUTH_URL=https://ANPASSEN_DEINE_DOMAIN
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - ./CHANGELOG.md:/app/public/CHANGELOG.md:ro
    depends_on:
      streambingo-api:
        condition: service_healthy
    networks:
      - streambingo-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── NestJS Backend API ───────────────────────────────────────────────────
  streambingo-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: streambingo-api
    restart: unless-stopped
    ports:
      - "4002:3001"
    environment:
      - NODE_ENV=production
      # ANPASSEN: Datenbankpasswort (muss mit POSTGRES_PASSWORD übereinstimmen)
      - DATABASE_URL=postgresql://streambingo:ANPASSEN_DB_PASSWORT@streambingo-db:5432/streambingo?schema=public
      - REDIS_URL=redis://streambingo-cache:6379
      - REDIS_ADAPTER_ENABLED=false
      # ANPASSEN: Mindestens 32 zufällige Zeichen (z.B. openssl rand -hex 32)
      - JWT_SECRET=ANPASSEN_MINDESTENS_32_ZUFAELLIGE_ZEICHEN_HIER
      - JWT_EXPIRES_IN=7d
      # ANPASSEN: Twitch App Client ID (von dev.twitch.tv/console)
      - TWITCH_CLIENT_ID=ANPASSEN_TWITCH_CLIENT_ID
      # ANPASSEN: Twitch App Client Secret
      - TWITCH_CLIENT_SECRET=ANPASSEN_TWITCH_CLIENT_SECRET
      # ANPASSEN: Muss exakt so in der Twitch App eingetragen sein
      - TWITCH_REDIRECT_URI=https://ANPASSEN_DEINE_DOMAIN/api/auth/callback/twitch
      # ANPASSEN: Zufälliger String 10-100 Zeichen
      - TWITCH_EVENTSUB_SECRET=ANPASSEN_EVENTSUB_SECRET
      # ANPASSEN: Öffentliche URL für Twitch EventSub Webhooks
      - TWITCH_EVENTSUB_CALLBACK_URL=https://ANPASSEN_DEINE_DOMAIN/api/eventsub
      # ANPASSEN: Einmaliges Token für den Setup-Assistenten (beliebiger String)
      - ADMIN_SETUP_TOKEN=ANPASSEN_SETUP_TOKEN
      # ANPASSEN: Öffentliche Domain
      - APP_URL=https://ANPASSEN_DEINE_DOMAIN
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      streambingo-db:
        condition: service_healthy
      streambingo-cache:
        condition: service_healthy
    networks:
      - streambingo-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── PostgreSQL Datenbank ─────────────────────────────────────────────────
  streambingo-db:
    image: postgres:17-alpine
    container_name: streambingo-db
    restart: unless-stopped
    ports:
      - "4003:5432"
    environment:
      - POSTGRES_DB=streambingo
      - POSTGRES_USER=streambingo
      # ANPASSEN: Sicheres Datenbankpasswort (muss mit DATABASE_URL übereinstimmen)
      - POSTGRES_PASSWORD=ANPASSEN_DB_PASSWORT
    volumes:
      - streambingo-db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/db/backup.sh:/backup.sh:ro
    networks:
      - streambingo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streambingo -d streambingo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ──────────────────────────────────────────────────────────
  streambingo-cache:
    image: redis:7-alpine
    container_name: streambingo-cache
    restart: unless-stopped
    ports:
      - "4004:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - streambingo-cache-data:/data
    networks:
      - streambingo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  streambingo-db-data:
    name: streambingo-db-data
  streambingo-cache-data:
    name: streambingo-cache-data

networks:
  streambingo-net:
    name: streambingo-net
    driver: bridge
