services:
  # Production overrides – no source volume mounts, optimized images
  streambingo-proxy:
    ports:
      - "4000:80"
    # Uncomment for SSL (with certbot):
    # ports:
    #   - "4000:80"
    #   - "4443:443"
    # volumes:
    #   - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    #   - ./docker/certbot/conf:/etc/letsencrypt:ro
    #   - ./docker/certbot/www:/var/www/certbot:ro

  streambingo-web:
    build:
      target: production
    volumes: []
    environment:
      - NODE_ENV=production

  streambingo-api:
    build:
      target: production
    volumes: []
    environment:
      - NODE_ENV=production

  streambingo-db:
    # No external port exposure in production – internal only
    ports: []

  streambingo-cache:
    # No external port exposure in production – internal only
    ports: []
