services:
  # ============================================================
  # streambingo-proxy – Nginx Reverse Proxy (public entry point)
  # ============================================================
  streambingo-proxy:
    image: nginx:1.27-alpine
    container_name: streambingo-proxy
    restart: unless-stopped
    ports:
      - "4000:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      streambingo-web:
        condition: service_healthy
      streambingo-api:
        condition: service_healthy
    networks:
      - streambingo-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # streambingo-web – Next.js 15 Frontend
  # ============================================================
  streambingo-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: streambingo-web
    restart: unless-stopped
    ports:
      - "4001:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:4000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - ./CHANGELOG.md:/app/public/CHANGELOG.md:ro
    depends_on:
      streambingo-api:
        condition: service_healthy
    networks:
      - streambingo-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # streambingo-api – NestJS 11 Backend API + WebSocket
  # ============================================================
  streambingo-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: streambingo-api
    restart: unless-stopped
    ports:
      - "4002:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_ADAPTER_ENABLED=${REDIS_ADAPTER_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - TWITCH_REDIRECT_URI=${TWITCH_REDIRECT_URI}
      - TWITCH_EVENTSUB_SECRET=${TWITCH_EVENTSUB_SECRET}
      - TWITCH_EVENTSUB_CALLBACK_URL=${TWITCH_EVENTSUB_CALLBACK_URL}
      - ADMIN_SETUP_TOKEN=${ADMIN_SETUP_TOKEN}
      - APP_URL=${APP_URL:-http://localhost:4000}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      streambingo-db:
        condition: service_healthy
      streambingo-cache:
        condition: service_healthy
    networks:
      - streambingo-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # streambingo-db – PostgreSQL 17
  # ============================================================
  streambingo-db:
    image: postgres:17-alpine
    container_name: streambingo-db
    restart: unless-stopped
    ports:
      - "4003:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-streambingo}
      - POSTGRES_USER=${POSTGRES_USER:-streambingo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - streambingo-db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/db/backup.sh:/backup.sh:ro
    networks:
      - streambingo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streambingo} -d ${POSTGRES_DB:-streambingo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # streambingo-cache – Redis 7
  # ============================================================
  streambingo-cache:
    image: redis:7-alpine
    container_name: streambingo-cache
    restart: unless-stopped
    ports:
      - "4004:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - streambingo-cache-data:/data
    networks:
      - streambingo-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================
# Named Volumes
# ============================================================
volumes:
  streambingo-db-data:
    name: streambingo-db-data
  streambingo-cache-data:
    name: streambingo-cache-data

# ============================================================
# Networks
# ============================================================
networks:
  streambingo-net:
    name: streambingo-net
    driver: bridge
